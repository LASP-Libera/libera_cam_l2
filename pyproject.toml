[build-system]
requires = ["uv_build >= 0.1.0, < 1.0.0"]
build-backend = "uv_build"

[project]
name = "cam_l2"
version = "0.1.0"
description = "Libera WFOV Camera L2 processing (cloud detection / cloud fraction) -- consolidated, with er3t/shdom pulled as pinned, unmodified dependencies rather than vendored copies"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Sebastian Schmidt", email = "sebastian.schmidt@lasp.colorado.edu"},
    ]
classifiers = [
    'Development Status :: 3 - Alpha',
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    'Topic :: Scientific/Engineering :: Atmospheric Science',
    ]
dependencies = [
    "er3t",
    "cartopy",
    "h5py",
    "matplotlib",
    "netcdf4",
    "numpy",
    "owslib",
    "psutil",
    "pysolar",
    "pyhdf",
    "requests",
    "scikit-image",
    "scipy",
    "tqdm",
    "uuid-utils",
    "structlog",
    "colorama",
    "xarray",
    "libera-utils==5.5.2",
    ]

[project.urls]
Homepage = "https://github.com/LASP-Libera/libera_cam_l2"

[tool.uv.sources]
er3t = {path = "software/er3t", editable = true}

[tool.uv]
# er3t==0.2.0 declares h5py>=3.15.1 (an unintentional artifact of its
# setuptools->uv migration -- grep shows only plain h5py.File() usage
# across er3t, nothing requiring >=3.15.1), which conflicts with
# libera-utils' transitive dependency on lasp-curryer, which caps
# h5py<3.14.0 in every published version. Force a version in the
# intersection until this is fixed properly upstream in er3t (see
# docs/PATCHES.md, patch 5 -- not yet applied/pushed to Hong's repo).
override-dependencies = ["h5py>=3.0,<3.14.0", "netcdf4>=1.6,<1.7.3"]
